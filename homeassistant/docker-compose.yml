version: "3.8"

services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:2026.10.2@sha256:33afb0659d786213264c2211f8d91c5fe87461c56eba6a3a546eb05fc71e89f4
    stop_grace_period: 60s
    volumes:
      - homeassistant_config:/config
    environment:
      TZ: America/Sao_Paulo
    networks:
      - traefik-public
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
          - node.hostname == pyuserver
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 0
      update_config:
        order: stop-first
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8123/', timeout=5).close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

networks:
  traefik-public:
    external: true

volumes:
  homeassistant_config:
