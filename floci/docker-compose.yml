services:
  floci:
    image: floci/floci:2.3.0@sha256:e0b292df4dc9559b7b1bf4f51bdda4bb8e269276236438cd03cae661260ea8a9
    volumes:
      - floci-data:/app/data
      - type: tmpfs
        target: /tmp
        tmpfs:
          size: 67108864
          mode: 1777
    environment:
      FLOCI_HOSTNAME: floci
      FLOCI_BASE_URL: http://floci:4566
      FLOCI_STORAGE_MODE: persistent
      FLOCI_STORAGE_PERSISTENT_PATH: /app/data
      FLOCI_SERVICES_S3_ENABLED: "true"
      FLOCI_SERVICES_S3_ENFORCE_AUTH: "true"
      FLOCI_SERVICES_LAMBDA_ENABLED: "false"
      FLOCI_SERVICES_ECS_ENABLED: "false"
      FLOCI_SERVICES_EC2_ENABLED: "false"
      FLOCI_SERVICES_EKS_ENABLED: "false"
      FLOCI_SERVICES_CODEBUILD_ENABLED: "false"
      FLOCI_SERVICES_SAGEMAKER_ENABLED: "false"
      FLOCI_SERVICES_RDS_ENABLED: "false"
      FLOCI_SERVICES_ELASTICACHE_ENABLED: "false"
      FLOCI_SERVICES_MEMORYDB_ENABLED: "false"
      FLOCI_SERVICES_NEPTUNE_ENABLED: "false"
      FLOCI_SERVICES_MSK_ENABLED: "false"
      FLOCI_SERVICES_AMAZONMQ_ENABLED: "false"
      FLOCI_SERVICES_OPENSEARCH_ENABLED: "false"
      FLOCI_SERVICES_MWAA_ENABLED: "false"
      FLOCI_SERVICES_APIGATEWAY_ENABLED: "false"
      FLOCI_SERVICES_APIGATEWAYV2_ENABLED: "false"
      FLOCI_SERVICES_APPSYNC_ENABLED: "false"
      FLOCI_SERVICES_UI_ENABLED: "false"
    networks:
      floci-internal:
        aliases:
          - floci
    read_only: true
    user: "1001:0"
    cap_drop:
      - ALL
    stop_grace_period: 30s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == pyuserver
      update_config:
        order: stop-first
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 0
      resources:
        limits:
          cpus: "1.00"
          memory: 1024M

  assets-proxy:
    image: nginx:stable-alpine@sha256:970364228b1e4f932abc22d321932816782cca8a20b85a77552a7cfe9acfb3b5
    configs:
      - source: floci-assets-nginx-v3
        target: /etc/nginx/nginx.conf
        mode: 0444
    networks:
      floci-internal:
      traefik-public:
        aliases:
          - floci-assets-proxy
    read_only: true
    user: "101:101"
    volumes:
      - type: tmpfs
        target: /tmp
        tmpfs:
          size: 16777216
          mode: 1777
    cap_drop:
      - ALL
    stop_grace_period: 10s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == pyuserver
      update_config:
        order: stop-first
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 0
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  floci-data:
    name: floci-data

networks:
  floci-internal:
    external: true
    name: floci-internal
  traefik-public:
    external: true
    name: traefik-public

configs:
  floci-assets-nginx-v3:
    file: ./assets-proxy.conf
